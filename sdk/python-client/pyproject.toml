[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuronto"
version = "1.0.0"
description = "Find the MCP servers, skills, agents and APIs that can do a task, across every public Agentic Resource Discovery (ARD) registry at once."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Neuronto" }]
keywords = ["mcp", "mcp-server", "ard", "agentic-resource-discovery", "discovery",
            "tool-discovery", "registry", "agents", "ai-agents", "llm-tools", "search"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = []

[project.urls]
Homepage = "https://neuronto.com"
Documentation = "https://neuronto.com/connect"
Source = "https://github.com/neuronto/agentic-resource-discovery"
Issues = "https://github.com/neuronto/agentic-resource-discovery/issues"

[project.scripts]
neuronto = "neuronto.__main__:main"

[tool.setuptools]
packages = ["neuronto"]
